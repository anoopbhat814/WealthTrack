services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wealthtrack
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: wealthtrack
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    env_file: ../.env
    depends_on: [postgres, forecast, marketdata]
    ports: ["3000:3000"]
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    env_file: ../.env
    depends_on: [postgres, redis]
  forecast:
    build: { context: ../services/forecast }
    ports: ["8000:8000"]
  marketdata:
    build: { context: ../services/marketdata }
    env_file: ../.env
    ports: ["8080:8080"]
    depends_on: [postgres]
volumes:
  pgdata:
